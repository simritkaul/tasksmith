services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tasksmith
      POSTGRES_PASSWORD: tasksmith
      POSTGRES_DB: tasksmith
    ports:
      - "5433:5432"
    volumes:
      - tasksmith-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasksmith -d tasksmith"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  tasksmith-pgdata:
